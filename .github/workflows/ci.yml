name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支或 PR 有新提交时，取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fixflow_test
          MYSQL_USER: fixflow_test
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_PROFILES_ACTIVE: test

      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3307/fixflow_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: fixflow_test
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

      MYSQL_USER: fixflow_test
      MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

      # CI 使用全新空库，通过迁移创建表结构
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package backend
        run: bash ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build