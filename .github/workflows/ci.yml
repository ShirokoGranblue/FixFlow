name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支或 PR 有新提交时，取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fixflow_test
          MYSQL_USER: fixflow_test
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_PROFILES_ACTIVE: test

      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3307/fixflow_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: fixflow_test
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

      MYSQL_USER: fixflow_test
      MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

      # CI 使用全新空库，通过迁移创建表结构
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package backend
        run: bash ./mvnw -B --no-transfer-progress verify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/app.jar
          if-no-files-found: error
          retention-days: 3

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3
          
  publish-images:
    name: Publish Docker images
    needs: [backend, frontend]

    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DockerFile
          push: true
          tags: ghcr.io/shirokogranblue/fixflow-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/DockerFile
          push: true
          tags: ghcr.io/shirokogranblue/fixflow-frontend:${{ github.sha }}

  deploy-local:
    name: Deploy to existing local services
    needs: [backend, frontend, publish-images]
    
    environment: production
    # 只有 main 分支的 push 通过 CI 后才部署
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64, fixflow-local]
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    # 同一时间只允许一次本地部署
    concurrency:
      group: fixflow-local-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: pwsh

    env:
      COMPOSE_PROJECT: ${{ vars.LOCAL_COMPOSE_PROJECT }}
      DEPLOY_ENV_FILE: ${{ vars.LOCAL_ENV_FILE }}
      # 同一提交绑定前后端镜像，便于快速回到上个版本。
      IMAGE_TAG: ${{ github.sha }}
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check deployment configuration
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SMOKE_BASE_URL)) {
              throw '请设置 SMOKE_BASE_URL'
          }

          if ([string]::IsNullOrWhiteSpace($env:COMPOSE_PROJECT)) {
            throw '请设置 LOCAL_COMPOSE_PROJECT'
          }

          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ENV_FILE)) {
            throw '请设置 LOCAL_ENV_FILE'
          }

          if (-not (Test-Path -LiteralPath $env:DEPLOY_ENV_FILE -PathType Leaf)) {
            throw '找不到本机部署环境文件'
          }

          docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) {
            throw '无法连接 Docker 引擎'
          }

          docker compose `
            --project-name "$env:COMPOSE_PROJECT" `
            --env-file "$env:DEPLOY_ENV_FILE" `
            -f docker-compose.yml `
            config --quiet

          if ($LASTEXITCODE -ne 0) {
            throw 'Compose 配置验证失败'
          }

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN |
            docker login ghcr.io `
              -u "${{ github.actor }}" `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw 'GHCR 登录失败'
          }

      - name: Pull frontend and backend from GHCR
        run: |
          $composeArgs = @(
              '--project-name', $env:COMPOSE_PROJECT,
              '--env-file', $env:DEPLOY_ENV_FILE,
              '-f', 'docker-compose.yml'
          )

          docker compose @composeArgs pull backend frontend

          if ($LASTEXITCODE -ne 0) {
              throw '无法拉取目标版本镜像'
          } 

      # 确保已有的 MySQL 服务启动，并等待就绪
      - name: Start MySQL and wait until ready
        run: |
          docker compose `
            --project-name "$env:COMPOSE_PROJECT" `
            --env-file "$env:DEPLOY_ENV_FILE" `
            -f docker-compose.yml `
            up -d --no-deps --wait --wait-timeout 180 mysql

          if ($LASTEXITCODE -ne 0) {
            throw 'MySQL 启动或健康检查失败，停止后续构建'
          }

      - name: Update existing application services (rollback on failure)
        run: |
          $ErrorActionPreference = 'Stop'
          $rollbackTag = "rollback-$env:GITHUB_RUN_ID"

          $composeArgs = @(
              '--project-name', $env:COMPOSE_PROJECT,
              '--env-file', $env:DEPLOY_ENV_FILE,
              '-f', 'docker-compose.yml'
          )

          $backendId = docker compose @composeArgs `
              ps --status running -q backend

          $frontendId = docker compose @composeArgs `
              ps --status running -q frontend

          $canRollback = (
              -not [string]::IsNullOrWhiteSpace($backendId)
          ) -and (
              -not [string]::IsNullOrWhiteSpace($frontendId)
          )

          if ($canRollback) {
              $previousBackend = docker inspect `
                  --format '{{.Image}}' $backendId

              docker image tag "$previousBackend" "ghcr.io/shirokogranblue/fixflow-backend:$rollbackTag"

              if ($LASTEXITCODE -ne 0) {
                  throw '读取旧后端镜像失败'
              }

              $previousFrontend = docker inspect `
                  --format '{{.Image}}' $frontendId

              docker image tag "$previousFrontend" "ghcr.io/shirokogranblue/fixflow-frontend:$rollbackTag"

              if ($LASTEXITCODE -ne 0) {
                  throw '读取旧前端镜像失败'
              }
          }
              
          try {
              # 部署新版本
              docker compose @composeArgs `
                  up -d --no-deps --no-build `
                  --pull never `
                  --wait --wait-timeout 180 `
                  backend frontend

              if ($LASTEXITCODE -ne 0) {
                  throw '新版本容器启动失败'
              }

              $address = docker compose @composeArgs port frontend 80

              if ($LASTEXITCODE -ne 0 -or
                  [string]::IsNullOrWhiteSpace($address)) {
                  throw '无法获取前端服务地址'
              }

              $baseUrl = "http://$address"

              & .\script\smoke-test.ps1 -BaseUrl $baseUrl

              # 验证实际访问链路
              & .\script\smoke-test.ps1 `
                  -BaseUrl $env:SMOKE_BASE_URL

              if (-not $?) {
                  throw '冒烟测试执行失败'
              }

              Write-Host '新版本发布成功'
          }
          catch {
              Write-Warning "发布失败：$_"

              if (-not $canRollback) {
                  throw '没有可恢复的旧版本，需要人工处理'
              }

              # 切换到先前保存的旧镜像标签
              $env:IMAGE_TAG = $rollbackTag

              docker compose @composeArgs `
                  up -d --no-deps --no-build `
                  --pull never `
                  --wait --wait-timeout 180 `
                  backend frontend

              if ($LASTEXITCODE -ne 0) {
                  throw '新版本失败，旧版本回滚也失败'
              }

              $address = docker compose @composeArgs port frontend 80

              if ($LASTEXITCODE -ne 0 -or
                  [string]::IsNullOrWhiteSpace($address)) {
                  throw '无法获取前端服务地址'
              }

              $baseUrl = "http://$address"

              & .\script\smoke-test.ps1 -BaseUrl $baseUrl

              # 回滚后再次检查
              & .\script\smoke-test.ps1 `
                  -BaseUrl $env:SMOKE_BASE_URL

              Write-Warning '旧版本已恢复并通过冒烟测试'
              throw '本次新版本发布失败，已完成应用回滚'
          }