name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支或 PR 有新提交时，取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fixflow_test
          MYSQL_USER: fixflow_test
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_PROFILES_ACTIVE: test

      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3307/fixflow_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: fixflow_test
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

      MYSQL_USER: fixflow_test
      MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}

      # CI 使用全新空库，通过迁移创建表结构
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package backend
        run: bash ./mvnw -B --no-transfer-progress verify

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

  deploy-local:
    name: Deploy to existing local services
    needs: [backend, frontend]

    # 只有 main 分支的 push 通过 CI 后才部署
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64, fixflow-local]
    timeout-minutes: 30

    permissions:
      contents: read

    # 同一时间只允许一次本地部署
    concurrency:
      group: fixflow-local-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: pwsh

    env:
      COMPOSE_PROJECT: ${{ vars.LOCAL_COMPOSE_PROJECT }}
      DEPLOY_ENV_FILE: ${{ vars.LOCAL_ENV_FILE }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check deployment configuration
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:COMPOSE_PROJECT)) {
            throw '请设置 LOCAL_COMPOSE_PROJECT'
          }

          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ENV_FILE)) {
            throw '请设置 LOCAL_ENV_FILE'
          }

          if (-not (Test-Path -LiteralPath $env:DEPLOY_ENV_FILE -PathType Leaf)) {
            throw '找不到本机部署环境文件'
          }

          docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) {
            throw '无法连接 Docker 引擎'
          }

          docker compose `
            --project-name "$env:COMPOSE_PROJECT" `
            --env-file "$env:DEPLOY_ENV_FILE" `
            -f docker-compose.yml `
            config --quiet

          if ($LASTEXITCODE -ne 0) {
            throw 'Compose 配置验证失败'
          }
            
      # 确保已有的 MySQL 服务启动，并等待就绪
      - name: Ensure MySQL running
        run: |
          docker compose up -d --no-recreate --wait --wait-timeout 180 mysql

      - name: Build frontend and backend
        run: |
          docker compose `
            --project-name "$env:COMPOSE_PROJECT" `
            --env-file "$env:DEPLOY_ENV_FILE" `
            -f docker-compose.yml `
            build backend frontend

          if ($LASTEXITCODE -ne 0) {
            throw '镜像构建失败，未执行容器更新'
          }

      - name: Update existing application services
        run: |
          docker compose `
            --project-name "$env:COMPOSE_PROJECT" `
            --env-file "$env:DEPLOY_ENV_FILE" `
            -f docker-compose.yml `
            up -d --no-deps --wait --wait-timeout 180 backend frontend

          if ($LASTEXITCODE -ne 0) {
            throw '应用启动检查失败，请查看本机容器状态和日志'
          }