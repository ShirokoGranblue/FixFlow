name: Check local runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Windows, X64, fixflow-local]
    timeout-minutes: 5

    steps:
      - name: Check local runner
        shell: pwsh
        run: |
          Write-Output "本地 runner 已成功接收 GitHub Actions 任务"
          Write-Output "PowerShell 版本："
          $PSVersionTable.PSVersion.ToString()