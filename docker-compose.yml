services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?missing}
      MYSQL_DATABASE: fixflow
      MYSQL_USER: ${MYSQL_USER:?missing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?missing}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -D "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    image: ghcr.io/shirokogranblue/fixflow-backend:${IMAGE_TAG:?missing}
    
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_USER: ${MYSQL_USER:?missing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?missing}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "4"
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/shirokogranblue/fixflow-frontend:${IMAGE_TAG:?missing}

    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
      
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - -T
        - "3"
        - http://127.0.0.1/index.html
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    # 当前仅作为缓存，不需要持久化缓存数据
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
